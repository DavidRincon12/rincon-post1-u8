spring.application.name=auditoria-hallazgos

# Base de datos H2 en memoria: se crea al arrancar y se pierde al detener la aplicación.
spring.datasource.url=jdbc:h2:mem:auditoria;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# No se serializan los nulos ni las fechas como números.
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
